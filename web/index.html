<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SCCP Sistema de Monitoreo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SCCP MONITOREO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('assets/fonts/Rajdhani-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: #000814;
      overflow: hidden;
      font-family: 'Rajdhani', 'Orbitron', sans-serif;
    }
    
    .tron-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(0deg, transparent 24%, rgba(0, 243, 255, 0.15) 25%, rgba(0, 243, 255, 0.15) 26%, transparent 27%, transparent 74%, rgba(0, 243, 255, 0.15) 75%, rgba(0, 243, 255, 0.15) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(0, 243, 255, 0.1) 25%, rgba(0, 243, 255, 0.1) 26%, transparent 27%, transparent 74%, rgba(0, 243, 255, 0.1) 75%, rgba(0, 243, 255, 0.1) 76%, transparent 77%, transparent);
      background-size: 80px 60px;
      animation: gridMove 20s linear infinite;
      opacity: 0.4;
      z-index: -1;
      pointer-events: none;
    }
    
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00F3FF, transparent);
      box-shadow: 0 0 20px #00F3FF;
      animation: scanline 5s linear infinite;
      z-index: -1;
      pointer-events: none;
    }
    
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: #000814;
    }
    
    .logo-container {
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
      position: relative;
    }
    
    .logo-border {
      width: 140px;
      height: 140px;
      border: 3px solid #00F3FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.6),
        0 0 60px rgba(0, 243, 255, 0.4),
        inset 0 0 20px rgba(0, 243, 255, 0.2);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .logo-border::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 1px solid #00F3FF;
      border-radius: 50%;
      animation: scanline-logo 3s linear infinite;
      z-index: 2;
    }
    
    .logo-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .cycle-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.85));
      opacity: 0;
      transform: scale(0.94);
      animation: logoCycle 4.8s ease-in-out infinite;
    }

    .cycle-logo.logo-1 { animation-delay: 0s; }
    .cycle-logo.logo-2 { animation-delay: 1.6s; }
    .cycle-logo.logo-3 { animation-delay: 3.2s; }

    @keyframes logoCycle {
      0% { opacity: 0; transform: scale(0.94); }
      8% { opacity: 1; transform: scale(1.0); }
      30% { opacity: 1; transform: scale(1.0); }
      38% { opacity: 0; transform: scale(1.04); }
      100% { opacity: 0; transform: scale(1.04); }
    }
    
    .loading-text {
      color: #00F3FF;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 20px;
      text-shadow: 
        0 0 10px #00F3FF,
        0 0 20px #00F3FF,
        0 0 30px #00F3FF;
      font-family: 'Orbitron', sans-serif;
    }
    
    .loading-subtitle {
      color: #FF0080;
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 10px;
      text-shadow: 0 0 10px #FF0080;
      font-family: 'Rajdhani', sans-serif;
    }

    .loading-version {
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 6px;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.35);
    }
    
    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid transparent;
      border-top-color: #00F3FF;
      border-right-color: #FF0080;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      margin-top: 30px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(60px); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    @keyframes scanline {
      0% { top: 0%; }
      100% { top: 100%; }
    }
    
    @keyframes scanline-logo {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    @media (max-width: 700px) {
      .loading {
        padding: 0 14px;
      }

      .logo-container {
        margin-bottom: 24px;
      }

      .logo-border {
        width: 100px;
        height: 100px;
        padding: 12px;
        border-width: 2px;
      }

      .loading-text {
        font-size: 14px;
        letter-spacing: 2px;
        text-align: center;
        margin-top: 14px;
      }

      .loading-subtitle {
        font-size: 10px;
        letter-spacing: 1.4px;
        text-align: center;
        margin-top: 8px;
      }

      .loading-version {
        font-size: 9px;
        letter-spacing: 1.1px;
      }

      .spinner {
        width: 46px;
        height: 46px;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="tron-grid"></div>
    <div class="scanline"></div>
    
    <div class="logo-container">
      <div class="logo-border">
        <div class="logo-stack" aria-hidden="true">
          <img class="cycle-logo logo-1" src="assets/assets/images/logo.png" alt="SCCP Logo 1">
          <img class="cycle-logo logo-2" src="assets/assets/images/logo2.png" alt="SCCP Logo 2">
          <img class="cycle-logo logo-3" src="assets/assets/images/logo3.png" alt="SCCP Logo 3">
        </div>
      </div>
    </div>
    <div class="loading-text">SCCP MONITOREO</div>
    <div class="loading-subtitle">Sistema de Control y Custodia Policial</div>
    <div class="loading-version">WEBAPP v1.1.3</div>
    <div class="spinner"></div>
  </div>
  
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function(ev) {
      // Keep splash visible until a full logo cycle is completed.
      const MIN_LOGO_CYCLE_MS = 5000;
      let firstFrameReady = false;
      let cycleCompleted = false;

      function hideLoadingIfReady() {
        if (!firstFrameReady || !cycleCompleted) return;
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.transition = 'opacity 0.5s';
          loading.style.opacity = '0';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 500);
        }
      }

      setTimeout(() => {
        cycleCompleted = true;
        hideLoadingIfReady();
      }, MIN_LOGO_CYCLE_MS);

      window.addEventListener('flutter-first-frame', function() {
        firstFrameReady = true;
        hideLoadingIfReady();
      });
    });
  </script>
</body>
</html>
