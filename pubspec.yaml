name: sccp_command_center
description: SCCP Command Center - Tactical HUD Interface
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  get: ^4.6.6
  
  # Backend
  supabase_flutter: ^2.3.4
  sccp_shared:
    path: ../sccp_suite/packages/sccp_shared
  
  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI Components
  flutter_animate: ^4.5.0
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  pin_code_fields: ^8.0.1
  flutter_loader: ^0.2.6
  vector_math: ^2.2.0
  flutter_webrtc: ^1.3.0
  qr_flutter: ^4.1.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  battery_plus: ^7.0.0
  connectivity_plus: ^7.1.1
  wakelock_plus: ^1.6.0
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/maps/
  
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 900
    
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/icons/SCCPapp.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icons/SCCPapp.png
    background_color: "#0A0E17"
    theme_color: "#0A0E17"
  windows:
    generate: true
    image_path: assets/icons/SCCPapp.png
    icon_size: 48
